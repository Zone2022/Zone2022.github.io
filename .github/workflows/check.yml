name: Check site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec jekyll build
      - run: node --check assets/app.js && node --check assets/scene.js && node --check assets/title-lens.js && node --check assets/entrance.js && node --check assets/journey.js
      - run: node scripts/check-build.mjs
