plugins:
  - jekyll-optional-front-matter
kramdown:
  input: Kramdown
collections:
  notebook_indexes:
    output: true
defaults:
  - scope:
      path: notes
      type: pages
    values:
      layout: note-link
optional_front_matter:
  remove_originals: false
include:
  - notes/**/*.md
  - notes/*.md
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - tests
  - node_modules
  - package.json
  - package-lock.json
  - vendor
  - TESTING.md
